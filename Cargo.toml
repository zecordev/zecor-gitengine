# SPDX-License-Identifier: Apache-2.0
[package]
name = "zecor-gitengine"
description = "In-process git: branch-state, merge-base, rev-parse, tree diff -- no `git` subprocess."
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Hilachem Ventures LLC"]
repository = "https://github.com/zecordev/zecor-gitengine"
rust-version = "1.75"

[lib]
name = "zecor_gitengine"
path = "src/lib.rs"

[[bin]]
name = "zecor-gitengine"
path = "src/main.rs"

[dependencies]
gix = { version = "0.87", default-features = false, features = [
    "revision", "blob-diff", "dirwalk", "status",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
